<!DOCTYPE html>
<html>
    <head>
        <!--create title shown in tab; not the same as header on webpage-->
        <title>Cinema Study</title>
        <!-- Load JsPsych -->
        <script src="https://unpkg.com/jspsych@8.2.2"></script>
        <link
            href="https://unpkg.com/jspsych@8.2.2/css/jspsych.css"
            rel="stylesheet"
            type="text/css"
        />

        <!--Load all necessary plugins-->
        <script src="https://unpkg.com/@jspsych/plugin-html-keyboard-response@2.1.0"></script>
        <script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
        <script src="https://unpkg.com/@jspsych/plugin-fullscreen@2.1.0"></script>
        <script src="https://unpkg.com/@jspsych/plugin-preload@2.1.0"></script>
        <script src="https://unpkg.com/@jspsych/plugin-browser-check@2.1.0"></script>
        <script src="https://unpkg.com/@jspsych/plugin-survey-likert@1.1.3"></script>
        <script src="https://unpkg.com/@jspsych/plugin-video-keyboard-response@2.1.0"></script>
        <script src="https://unpkg.com/@jspsych/plugin-html-video-response@2.1.0"></script>

        <script src="https://unpkg.com/@jspsych/plugin-survey@3.0.0"></script>
        <link
            rel="stylesheet"
            href="https://unpkg.com/@jspsych/plugin-survey@3.0.0/css/survey.css"
        />

        <!--Load Stimuli and custom plugins-->
        <script src="https://realitybending.github.io/JSmisc/misc/utils.js"></script>
        <script src="https://unpkg.com/@jspsych-contrib/plugin-pipe@0.4.0"></script>
        <script src="demographics.js"></script>
        <script src="fiction.js"></script>
        <script src="questionnaires.js"></script>

        <style>
            #jspsych-image-keyboard-response-stimulus {
                /*adjust image stimuli params to fit screen*/
                height: auto;
                width: 55%;
            }

            body {
                /*Hide scrollbar while keeping it functional */
                overflow-y: scroll;
                overflow-x: flow;
            }

            Body::-webkit-scrollbar {
                display: none;
            }

            /* set canvas to be full screen */
            .jspsych-content {
                max-width: 100%;
            }
        </style>
    </head>

    <body></body>

    <script>
        // OSF link and data pipe create projects and link
        /* Initialize jsPsych ================================================================*/
        var jsPsych = initJsPsych({
            show_progress_bar: true,
            message_progress_bar: "Completion",
            on_finish: function () {
                // jsPsych.data.displayData("json")
                // jsPsych.data
                // .get()
                // .localSave(
                // "json",
                // `${jsPsych.data.get().values()[0]["participant_id"]
                // }_FF.json`
                // )
                // window.location = ""
            },
        })

        var timeline = []
        participantID = jsPsych.randomization.randomID(10)

        /* Initialize Experiment =============================================================*/
        // Fullscreen Mode
        // timeline.push({
        //     type: jsPsychFullscreen,
        //     fullscreen_mode: true,
        // })

        timeline.push(demographics_browser_info)
        timeline.push(ConsentForm)
        timeline.push(demographic_questions)
        timeline.push(media)
        timeline.push(bait)

        // Experiment Part 1
        timeline.push(fiction_preload)
        timeline.push(Experiment_Instructions)
        timeline.push(test_procedure_1)

        // Experiment Part 2
        timeline.push(Experiment_Instructions_2)
        timeline.push(test_procedure_2)

        timeline.push(experiment_feedback)
        timeline.push(demographics_debriefing)
        timeline.push(demographics_raffle)

        // // Save data via DataPipe
        timeline.push({
            type: jsPsychPipe,
            action: "save",
            experiment_id: "ICV4Etaleueb", // This in generated in the DataPipe interface
            filename: `${participantID}.csv`,
            data_string: () => jsPsych.data.get().csv(),
        })

        timeline.push(demographics_endscreen)

        /* ----------------- Run the timeline ----------------- */
        jsPsych.run(timeline)
    </script>
</html>
